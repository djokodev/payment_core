spring.application.name=payment_core

# src/main/resources/application.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/payment_core
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crée/actualise automatiquement les tables à partir de tes entités Java
# (pratique en dev, jamais en prod)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true